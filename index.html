<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pybyte104</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ctp-blue: #89b4fa;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-surface0: #313244;
            --ctp-surface1: #45475a;
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
        }

        body {
            background-color: var(--ctp-base);
            color: var(--ctp-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }

        /* iPhone Island Top Bar */
        header {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--ctp-surface1);
            backdrop-filter: blur(20px);
            padding: 8px 20px;
            border-radius: 26px;
            width: 90%;
            max-width: 350px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--ctp-surface0);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 1rem;
        }

        .logo {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--ctp-blue);
            flex: 1;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex: 1;
            justify-content: flex-end;
        }

        .nav-links a {
            color: var(--ctp-subtext1);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--ctp-blue);
        }

        main {
            margin-top: 80px;
            padding: 3rem 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--ctp-text);
            font-weight: 700;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--ctp-subtext1);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--ctp-blue);
            color: var(--ctp-base);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--ctp-blue);
            border: 1px solid var(--ctp-blue);
        }

        .btn-secondary:hover {
            background: var(--ctp-blue);
            color: var(--ctp-base);
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 3rem;
        }

        .social-link {
            color: var(--ctp-blue);
            text-decoration: none;
            font-size: 1.2rem;
            transition: opacity 0.3s ease;
        }

        .social-link:hover {
            opacity: 0.7;
        }

        footer {
            background: var(--ctp-mantle);
            border-top: 1px solid var(--ctp-surface0);
            padding: 2rem;
            text-align: center;
            color: var(--ctp-subtext1);
            font-size: 0.9rem;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            header {
                width: 95%;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .nav-links a {
                font-size: 0.75rem;
            }

            .cta-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">pybyte104</div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="about">
            <h1>Hey, I'm pybyte104</h1>
            <p>Building cool things on the internet</p>
            <div class="cta-buttons">
                <a href="#contact" class="btn btn-primary">Let's Talk</a>
                <a href="https://github.com/pybyte104" class="btn btn-secondary">View Work</a>
            </div>
            <div class="social-links">
                <a href="https://github.com/pybyte104" class="social-link" title="GitHub">→</a>
                <a href="#" class="social-link" title="Twitter">𝕏</a>
            </div>
        </section>
    </main>

    <footer id="contact">
        <p>© 2024 pybyte104</p>
    </footer>
</body>
</html>
